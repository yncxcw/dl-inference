name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install formatters
        run: python -m pip install black==24.10.0 clang-format==18.1.5

      - name: Check formatting
        run: ./format --check

  build:
    name: Build (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0
          python -m pip install build numpy==2.2.6 scikit-build-core triton==3.4.0
          python -c "import sys, numpy, torch, triton; print(sys.version); print('numpy', numpy.__version__); print('torch', torch.__version__); print('triton', triton.__version__)"

      - name: Configure
        run: |
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DDLI_BUILD_TESTS=ON \
            -DDLI_BUILD_EXAMPLES=ON \
            -DDLI_ENABLE_TRITON_AOT=OFF \
            -DDLI_ENABLE_GRPC=OFF \
            -DDLI_BUILD_PYTHON_BINDINGS=ON

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Build Python wheel
        run: python -m build --wheel --no-isolation

      - name: Test installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          import json

          import torch

          import dli
          import dli_export  # noqa: F401
          import dli_ops  # noqa: F401

          graph = dli.Graph.from_json(json.dumps({
              "format": "dli.graph.v1",
              "inputs": ["x"],
              "outputs": ["y"],
              "nodes": [{
                  "name": "relu",
                  "op": "aten",
                  "inputs": ["x"],
                  "outputs": ["y"],
                  "attrs": {"name": "aten::relu"},
              }],
          }))
          outputs = dli.Engine().run(graph, {"x": torch.tensor([-1.0, 2.0])})
          torch.testing.assert_close(outputs["y"], torch.tensor([0.0, 2.0]))
          PY

      - name: Upload Python wheel
        uses: actions/upload-artifact@v6
        with:
          name: dl-inference-python-3.11
          path: dist/*.whl
          if-no-files-found: error
